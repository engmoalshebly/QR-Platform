name: notification-gateway
services:
  notification-api:
    build: .
    image: notification-gateway:1.0.0
    restart: unless-stopped
    env_file: ${NOTIFY_ENV_FILE:-/home/alrazi/.qentry/notifications.env}
    volumes:
      - notifications:/data
    networks:
      backend:
        aliases: [notification-api.internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  backend:
    external: true
    name: qentry-prod_app
volumes:
  notifications:
