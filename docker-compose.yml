services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: qr_postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qentry
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Celery)
  redis:
    image: redis:7-alpine
    container_name: qr_redis
    ports:
      # Host access is loopback-only; application containers use the private
      # Compose network and the `redis:6379` service name.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Internal Link payment gateway (never expose this port publicly in production)
  link-gateway:
    build:
      context: ./link-gateway-service
      dockerfile: Dockerfile
    container_name: qr_link_gateway
    env_file:
      - ./link-gateway-service/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_api
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      LINK_GATEWAY_URL: http://link-gateway:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      link-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_worker
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_scheduler
    command: python -m app.scheduler_runner
    env_file:
      - .env
    environment:
      LINK_GATEWAY_URL: http://link-gateway:3000
      RUN_EMBEDDED_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      link-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
