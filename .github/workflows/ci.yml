name: Qentry CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qentry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d qentry_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/qentry_test
      # Tenant requests run as qentry_app, which is subject to RLS.
      DATABASE_APP_URL: postgresql+asyncpg://qentry_app:cirlsapppw1@127.0.0.1:5432/qentry_test
      RLS_APP_PASSWORD: cirlsapppw1
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qentry_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      SUPABASE_JWT_SECRET: test-jwt-secret
      INVITE_HMAC_SECRET: test-invite-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency vulnerability audit (runtime)
        run: pip-audit -r requirements.txt
      - name: Migration smoke test from blank database
        run: python scripts/migrations/ci_migrate.py
      - name: Create the isolated database for the usage-concurrency tests
        # tests/test_monthly_usage_atomic.py creates and TRUNCATEs its own tables;
        # it must never share a database with the migrated schema above.
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE quota_iso"
      - name: Full test suite with coverage ratchet
        # Ratchet: raise this floor as coverage grows; it must never be lowered.
        env:
          QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quota_iso
          P2_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          P2_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=55
      - name: Tenant isolation, RLS and access policy (must always run, shown separately)
        run: >-
          pytest tests/test_cross_tenant_isolation.py tests/test_tenant_status_and_exemptions.py
          tests/test_rls_enforcement.py tests/test_app_role_wiring.py
          tests/test_database_access_policy.py tests/test_authz_inventory.py -v --tb=short

  web-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            field-pwa/package-lock.json
      - name: Install management console dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit management console (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Lint management console
        run: npm run lint
        working-directory: frontend
      - name: Build management console
        run: npm run build
        working-directory: frontend
      - name: Install browser for console smoke tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run console browser smoke tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Install field PWA dependencies
        run: npm ci
        working-directory: field-pwa
      - name: Audit field PWA (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: field-pwa
      - name: Build field PWA
        run: npm run build
        working-directory: field-pwa

  link-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: link-gateway-service/package-lock.json
      - name: Install payment gateway dependencies
        run: npm ci
        working-directory: link-gateway-service
      - name: Audit payment gateway (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: link-gateway-service
      - name: Test payment gateway (build + safety tests)
        run: npm test
        working-directory: link-gateway-service

  field-expo:
    # Known open risk: high-severity advisories in expo/react-native 57/0.86
    # transitive packages have no in-major fix.  The job keeps type-checking and
    # the cleartext guard, but the audit is not a gate until the Expo upgrade lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: field-expo/package-lock.json
      - name: Install field mobile dependencies
        run: npm ci
        working-directory: field-expo
      - name: Type-check field mobile app
        run: npx tsc --noEmit
        working-directory: field-expo
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /dev/null
        working-directory: field-expo
      - name: Reject cleartext Android traffic
        run: >-
          node -e "const config = require('./app.json'); if (config.expo.android.usesCleartextTraffic !== false) { throw new Error('Android cleartext traffic must be disabled'); }"
        working-directory: field-expo

  container:
    runs-on: ubuntu-latest
    needs: [backend, web-clients]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qentry-api:ci
      - name: Verify image contents and runtime user
        run: |
          docker run --rm --entrypoint sh qentry-api:ci -c \
            'test -f /app/field-pwa/dist/index.html && test -r /app/app/main.py && test "$(id -u)" = "1000"'
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generation-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate generation alert rules and synthetic failures
        run: >-
          docker run --rm --network none
          -v "$PWD/deploy/monitoring:/rules:ro" -w /rules
          --entrypoint /bin/promtool
          prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
          test rules generation-alerts.test.yml
