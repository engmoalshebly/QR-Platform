name: Release

# Builds the API and link-gateway images from a version tag, pushes them to GHCR,
# and prints the digests that go into /etc/qentry/compose.env.  Deployment itself
# is a separate, approved step on the production environment.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write          # keyless cosign signing

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: qentry-api
            context: .
            file: Dockerfile
          - image: qentry-link-gateway
            context: link-gateway-service
            file: link-gateway-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image by digest
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}

      - name: Print digest for compose.env
        run: echo "${{ matrix.image }}=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
