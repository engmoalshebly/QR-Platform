[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = --strict-markers
markers =
    unit: isolated tests with no external services
    integration: tests requiring PostgreSQL/Redis or the application stack
    e2e: end-to-end tests requiring running services
    external: tests requiring a separately running local/cloud service
